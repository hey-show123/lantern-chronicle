<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="img/favicon.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>事前登録の確認｜ランタンクロニクル</title><meta name="robots" content="noindex"></head>
<body><main class="simple"><div class="card"><h2 id="t">処理しています…</h2><p id="b" class="lead" style="margin:0 auto"></p><p style="margin-top:20px"><a class="btn ghost" href="./">トップへ</a></p></div></main>
<script>
(async()=>{const t=new URLSearchParams(location.search).get('t');const T=document.getElementById('t'),B=document.getElementById('b');
 if(!t){T.textContent='リンクが正しくありません';return}
 try{const r=await fetch('https://mxebwsikgdhzcfcwtljc.supabase.co/functions/v1/prereg/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t})});
  if(r.ok){T.textContent='事前登録が完了しました';B.textContent='ありがとうございます。配信の日に、お知らせのメールをお届けします。'}else{T.textContent='リンクが無効か、期限が切れています';B.textContent='もういちど登録するか、hey_show.dev@outlook.jp へご連絡ください。'}
 }catch(e){T.textContent='通信できませんでした';B.textContent='時間をおいて、もういちどお試しください。'}})();
</script></body></html>
